name: Build & Deploy

# Run by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit so a moved tag cannot change what runs next to the store secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Zip from inside plugin/ so manifest.json sits at the root of the zip.
      - name: Zip Plugin
        run: cd plugin && zip -r ../extension.zip .

      # Only this step sees the store secrets.
      - name: Upload to Chrome Webstore
        run: bash .github/scripts/publish-chrome.sh
        env:
          EXTENSION_ID: jbfgmfpakhabhhpefblmehnadjjkadna
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
